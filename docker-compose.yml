version: "3.8"

# CocoNet Platform — Local Development Stack
# Fabric 2.5 LTS | Hardhat local EVM | MongoDB 7 | MinIO
#
# Run once to generate crypto material before starting:
#   PowerShell: .\scripts\generate-artifacts.ps1
# Then start everything:
#   docker compose up -d
# Join channel after network is up:
#   PowerShell: .\scripts\setup-channel.ps1

networks:
  coconet-net:
    driver: bridge

volumes:
  orderer.coconet.local:
  peer0.buyer.coconet.local:
  peer0.supplier.coconet.local:
  peer0.lender.coconet.local:
  peer0.platform.coconet.local:
  peer0.auditor.coconet.local:
  mongodb-data:
  minio-data:

services:

  # ─── Hyperledger Fabric Orderer ──────────────────────────────────────────────
  orderer.coconet.local:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/coconet.local/orderers/orderer.coconet.local/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/coconet.local/orderers/orderer.coconet.local/tls:/var/hyperledger/orderer/tls
      - ./fabric-network/channel-artifacts:/var/hyperledger/production/orderer
      - orderer.coconet.local:/var/hyperledger/production
    ports:
      - "7050:7050"   # gRPC
      - "7053:7053"   # Admin (osnadmin)
      - "8443:8443"   # Operations / metrics
    networks:
      - coconet-net

  # ─── Fabric Peers ─────────────────────────────────────────────────────────────
  peer0.buyer.coconet.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.buyer.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.buyer.coconet.local
      - CORE_PEER_ADDRESS=peer0.buyer.coconet.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.buyer.coconet.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.buyer.coconet.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.buyer.coconet.local:7051
      - CORE_PEER_LOCALMSPID=BuyerMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0buyer"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=coconet_coconet-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config/peerOrganizations/buyer.coconet.local/peers/peer0.buyer.coconet.local/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/buyer.coconet.local/peers/peer0.buyer.coconet.local/tls:/etc/hyperledger/fabric/tls
      - peer0.buyer.coconet.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "7051:7051"   # gRPC
      - "9444:9444"   # Operations
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local

  peer0.supplier.coconet.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.supplier.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.supplier.coconet.local
      - CORE_PEER_ADDRESS=peer0.supplier.coconet.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.supplier.coconet.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.supplier.coconet.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.supplier.coconet.local:8051
      - CORE_PEER_LOCALMSPID=SupplierMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0supplier"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=coconet_coconet-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config/peerOrganizations/supplier.coconet.local/peers/peer0.supplier.coconet.local/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/supplier.coconet.local/peers/peer0.supplier.coconet.local/tls:/etc/hyperledger/fabric/tls
      - peer0.supplier.coconet.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "8051:8051"
      - "9445:9445"
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local

  peer0.lender.coconet.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.lender.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.lender.coconet.local
      - CORE_PEER_ADDRESS=peer0.lender.coconet.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.lender.coconet.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lender.coconet.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lender.coconet.local:9051
      - CORE_PEER_LOCALMSPID=LenderMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0lender"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=coconet_coconet-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config/peerOrganizations/lender.coconet.local/peers/peer0.lender.coconet.local/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/lender.coconet.local/peers/peer0.lender.coconet.local/tls:/etc/hyperledger/fabric/tls
      - peer0.lender.coconet.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "9051:9051"
      - "9446:9446"
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local

  peer0.platform.coconet.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.platform.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.platform.coconet.local
      - CORE_PEER_ADDRESS=peer0.platform.coconet.local:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.platform.coconet.local:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.platform.coconet.local:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.platform.coconet.local:10051
      - CORE_PEER_LOCALMSPID=PlatformMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9447
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0platform"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=coconet_coconet-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config/peerOrganizations/platform.coconet.local/peers/peer0.platform.coconet.local/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/platform.coconet.local/peers/peer0.platform.coconet.local/tls:/etc/hyperledger/fabric/tls
      - peer0.platform.coconet.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "10051:10051"
      - "9447:9447"
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local

  peer0.auditor.coconet.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.auditor.coconet.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.auditor.coconet.local
      - CORE_PEER_ADDRESS=peer0.auditor.coconet.local:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.auditor.coconet.local:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditor.coconet.local:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditor.coconet.local:11051
      - CORE_PEER_LOCALMSPID=AuditorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9448
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0auditor"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=coconet_coconet-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config/peerOrganizations/auditor.coconet.local/peers/peer0.auditor.coconet.local/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/auditor.coconet.local/peers/peer0.auditor.coconet.local/tls:/etc/hyperledger/fabric/tls
      - peer0.auditor.coconet.local:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "11051:11051"
      - "9448:9448"
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local

  # ─── CLI (for channel setup and admin commands) ───────────────────────────────
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: coconet-cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      # Default to Platform org admin for channel admin operations
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.platform.coconet.local:10051
      - CORE_PEER_LOCALMSPID=PlatformMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/crypto/peerOrganizations/platform.coconet.local/peers/peer0.platform.coconet.local/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/crypto/peerOrganizations/platform.coconet.local/peers/peer0.platform.coconet.local/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/crypto/peerOrganizations/platform.coconet.local/peers/peer0.platform.coconet.local/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/crypto/peerOrganizations/platform.coconet.local/users/Admin@platform.coconet.local/msp
      - ORDERER_CA=/opt/crypto/ordererOrganizations/coconet.local/orderers/orderer.coconet.local/msp/tlscacerts/tlsca.coconet.local-cert.pem
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric-network/crypto-config:/opt/crypto
      - ./fabric-network/channel-artifacts:/opt/channel-artifacts
      - ./chaincodes:/opt/chaincodes
    networks:
      - coconet-net
    depends_on:
      - orderer.coconet.local
      - peer0.buyer.coconet.local
      - peer0.supplier.coconet.local
      - peer0.lender.coconet.local
      - peer0.platform.coconet.local
      - peer0.auditor.coconet.local

  # ─── Hardhat Local EVM Node (Polygon dev target) ──────────────────────────────
  hardhat:
    image: node:20-alpine
    container_name: coconet-hardhat
    working_dir: /app
    command: sh -c "npm install --prefer-offline && npx hardhat node --hostname 0.0.0.0"
    volumes:
      - ./contracts:/app
    ports:
      - "8545:8545"
    networks:
      - coconet-net

  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: coconet-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=coconetadmin
      - MONGO_INITDB_ROOT_PASSWORD=coconetsecret
      - MONGO_INITDB_DATABASE=coconetdb
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - coconet-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (document storage) ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: coconet-minio
    environment:
      - MINIO_ROOT_USER=coconetadmin
      - MINIO_ROOT_PASSWORD=coconetsecret123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    networks:
      - coconet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
